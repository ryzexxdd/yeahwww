<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>yeahwww</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">

  <style>
    /* ===== ACCESS GATE (НЕ ЛОМАЕТ КЛИКИ) ===== */
    #gateOverlay{
      position:fixed;
      inset:0;
      background:#f6f6f7;
      z-index:99999;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding-top:36px;
      pointer-events: all; /* 🔴 ВАЖНО */
    }
    #gateOverlay.hidden{
      display:none;
      pointer-events:none;
    }
    .gateCard{
      width:94%;
      max-width:420px;
      background:#fff;
      border-radius:16px;
      padding:22px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
    }
    .gateTitle{font-size:22px;font-weight:700;margin:10px 0 6px;}
    .gateSubtitle{color:#6b6b6b;margin-bottom:14px;}
    .codeInput{
      width:80%;
      max-width:320px;
      margin:10px auto;
      font-size:22px;
      text-align:center;
      padding:12px;
      border-radius:12px;
      border:1px solid #eee;
      display:block;
    }
    .btnPrimary{
      background:#111;
      color:#fff;
      padding:12px 18px;
      border-radius:12px;
      border:none;
      font-weight:700;
      cursor:pointer;
    }
    .gateMsg{margin-top:10px;color:#b00;}
    .btnTelegram{
      display:block;
      margin:14px auto 0;
      background:#0a84ff;
      color:#fff;
      padding:12px;
      border-radius:12px;
      text-decoration:none;
      width:85%;
    }
  </style>
</head>

<body>

<!-- 🔒 ACCESS OVERLAY -->
<div id="gateOverlay">
  <div class="gateCard">
    <div class="gateTitle">Получение доступа</div>
    <div class="gateSubtitle">Введите одноразовый код (6 цифр)</div>
    <input id="gateCode" class="codeInput" maxlength="6" placeholder="XXXXXX">
    <button id="gateBtn" class="btnPrimary">Подтвердить код</button>
    <div id="gateMsg" class="gateMsg"></div>
    <a class="btnTelegram" href="https://t.me/yeahwww" target="_blank">
      Написать в Telegram
    </a>
  </div>
</div>

<!-- ================= ТВОЙ САЙТ (БЕЗ ИЗМЕНЕНИЙ) ================= -->
<!-- ⬇⬇⬇ ВЕСЬ ТВОЙ HTML НИЖЕ ОСТАЁТСЯ 1 В 1 ⬇⬇⬇ -->

<!-- (дальше идёт твой код: header, tabs, sections, scripts и т.д.) -->

<script>
function getDeviceId(){
  let id = localStorage.getItem('device_id_server');
  if(!id){
    id = crypto.randomUUID ? crypto.randomUUID() : 'dev-'+Date.now();
    localStorage.setItem('device_id_server', id);
  }
  return id;
}

const overlay = document.getElementById('gateOverlay');
const btn = document.getElementById('gateBtn');
const input = document.getElementById('gateCode');
const msg = document.getElementById('gateMsg');

/* если уже был вход */
if(localStorage.getItem('site_access_granted_server') === '1'){
  overlay.classList.add('hidden');
}

btn.onclick = async () => {
  const code = input.value.trim();
  if(!/^\d{6}$/.test(code)){
    msg.textContent = 'Код должен быть 6 цифр';
    return;
  }

  msg.textContent = 'Проверка...';

  const res = await fetch('/api/verify',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      code,
      deviceId:getDeviceId()
    })
  });

  const j = await res.json();

  if(res.ok && j.ok){
    localStorage.setItem('site_access_granted_server','1');
    overlay.classList.add('hidden'); // 🔴 ВАЖНО
  } else {
    msg.textContent = j.error || 'Неверный код';
  }
};
</script>

</body>
</html>
