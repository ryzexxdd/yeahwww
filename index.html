<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yeahwww</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>

<!-- ================== ТВОЙ САЙТ (БЕЗ ИЗМЕНЕНИЙ) ================== -->
<!-- ВЕСЬ твой HTML ниже — 그대로 -->

<div class="header">
  <button class="back-btn" onclick="history.back()">‹</button>
  <div class="header-title">Удостоверение личности</div>
</div>

<div class="tabs">
  <button class="tab active" data-tab="doc">Документ</button>
  <button class="tab" data-tab="req">Реквизиты</button>
</div>

<section id="doc" class="screen active">
  <div class="photo-area">
    <button id="uploadBtn" class="upload-btn">Загрузить фото</button>
    <input type="file" id="photo" accept="image/*" hidden>
    <div id="preview"></div>
  </div>

  <div class="actions">
    <button class="primary" id="showQrBtn">
      <span class="btn-icon qr"></span>
      <span>Предъявить документ</span>
    </button>

    <button class="outline">
      <span class="btn-icon share"></span>
      <span>Отправить документ</span>
    </button>
  </div>
</section>

<section id="req" class="screen">
  <div class="form">
    <!-- форма без изменений -->
  </div>
</section>

<div id="qrModal" class="qr-modal">
  <div class="qr-sheet">
    <div class="qr-header">
      <div class="qr-title">Удостоверение личности</div>
      <button class="qr-close" id="closeQr">×</button>
    </div>
    <div class="qr-content">
      <div class="qr-text">Покажите QR-код сотруднику</div>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=yeahwww" class="qr-image">
      <div class="qr-subtext">или скажите код</div>
      <div class="qr-code">983517</div>
    </div>
  </div>
</div>

<!-- ================== ACCESS OVERLAY (ДОБАВЛЕНО) ================== -->
<div id="gateOverlay">
  <div class="gateCard">
    <div class="gateTitle">Получение доступа</div>
    <div class="gateSubtitle">Введите одноразовый код</div>
    <input id="gateCode" class="codeInput" maxlength="6" placeholder="XXXXXX">
    <button id="gateBtn" class="btnPrimary">Подтвердить код</button>
    <div id="gateMsg" class="gateMsg"></div>
    <a class="btnTelegram" href="https://t.me/yeahwww" target="_blank">Написать в Telegram</a>
  </div>
</div>

<style>
#gateOverlay{
  position:fixed;
  inset:0;
  background:#f6f6f7;
  z-index:99999;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding-top:36px;
}
.gateCard{
  width:94%;
  max-width:420px;
  background:#fff;
  border-radius:16px;
  padding:22px;
  text-align:center;
}
.codeInput{width:80%;font-size:22px;text-align:center;padding:12px;}
.btnPrimary{margin-top:12px;padding:12px 18px;}
.gateMsg{color:#b00;margin-top:8px;}
</style>

<script>
function getDeviceId(){
  let id = localStorage.getItem('device_id_server');
  if(!id){
    id = crypto.randomUUID ? crypto.randomUUID() : 'dev-'+Date.now();
    localStorage.setItem('device_id_server', id);
  }
  return id;
}

const overlay = document.getElementById('gateOverlay');
const btn = document.getElementById('gateBtn');
const input = document.getElementById('gateCode');
const msg = document.getElementById('gateMsg');

if(localStorage.getItem('site_access_granted_server') === '1'){
  overlay.parentNode.removeChild(overlay);
}

btn.onclick = async () => {
  const code = input.value.trim();
  if(!/^\d{6}$/.test(code)){
    msg.textContent = 'Введите 6 цифр';
    return;
  }

  msg.textContent = 'Проверка...';

  const res = await fetch('/api/verify',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ code, deviceId:getDeviceId() })
  });

  const j = await res.json();

  if(res.ok && j.ok){
    localStorage.setItem('site_access_granted_server','1');
    overlay.parentNode.removeChild(overlay);
  } else {
    msg.textContent = j.error || 'Неверный код';
  }
};
</script>

</body>
</html>
