<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>yeahwww</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">

  <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
  <link rel="apple-touch-icon" href="icon-512.png">

  <!-- ===== ACCESS GATE STYLE (НЕ ТРОГАЕТ САЙТ) ===== -->
  <style>
    #gateOverlay{
      position:fixed;
      inset:0;
      background:#f6f6f7;
      z-index:99999;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding-top:36px;
    }
    .gateCard{
      width:94%;
      max-width:420px;
      background:#fff;
      border-radius:16px;
      padding:22px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
    }
    .gateTitle{font-size:22px;font-weight:700;margin:10px 0 6px;}
    .gateSubtitle{color:#6b6b6b;margin-bottom:14px;}
    .codeInput{
      width:80%;
      max-width:320px;
      margin:10px auto;
      font-size:22px;
      text-align:center;
      padding:12px;
      border-radius:12px;
      border:1px solid #eee;
      display:block;
    }
    .btnPrimary{
      background:#111;
      color:#fff;
      padding:12px 18px;
      border-radius:12px;
      border:none;
      font-weight:700;
      cursor:pointer;
    }
    .gateMsg{margin-top:10px;color:#b00;}
    .btnTelegram{
      display:block;
      margin:14px auto 0;
      background:#0a84ff;
      color:#fff;
      padding:12px;
      border-radius:12px;
      text-decoration:none;
      width:85%;
    }
  </style>
</head>

<body>

<!-- 🔒 ACCESS OVERLAY -->
<div id="gateOverlay">
  <div class="gateCard">
    <div class="gateTitle">Получение доступа</div>
    <div class="gateSubtitle">Введите одноразовый код (6 цифр)</div>
    <input id="gateCode" class="codeInput" maxlength="6" placeholder="XXXXXX">
    <button id="gateBtn" class="btnPrimary">Подтвердить код</button>
    <div id="gateMsg" class="gateMsg"></div>
    <a class="btnTelegram" href="https://t.me/yeahwww" target="_blank">
      Написать в Telegram
    </a>
  </div>
</div>

<!-- ================= ТВОЙ САЙТ (БЕЗ ИЗМЕНЕНИЙ) ================= -->

<script>
document.addEventListener('DOMContentLoaded', () => {

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });

  const fields = ['fio', 'iin', 'birth', 'docnum', 'issued', 'expiry'];
  fields.forEach(id => {
    const input = document.getElementById(id);
    if (!input) return;
    input.value = localStorage.getItem(id) || '';
    input.addEventListener('input', () => {
      localStorage.setItem(id, input.value);
    });
  });

});
</script>

<div class="header">
  <button class="back-btn" onclick="history.back()">‹</button>
  <div class="header-title">Удостоверение личности</div>
</div>

<div class="tabs">
  <button class="tab active" data-tab="doc">Документ</button>
  <button class="tab" data-tab="req">Реквизиты</button>
</div>

<section id="doc" class="screen active">
  <div class="photo-area">
    <button id="uploadBtn" class="upload-btn">Загрузить фото</button>
    <input type="file" id="photo" accept="image/*" hidden>
    <div id="preview"></div>
  </div>

  <div class="actions">
    <button class="primary" id="showQrBtn">
      <span class="btn-icon qr"></span>
      <span>Предъявить документ</span>
    </button>

    <button class="outline">
      <span class="btn-icon share"></span>
      <span>Отправить документ</span>
    </button>
  </div>
</section>

<section id="req" class="screen">
  <div class="form">
    <!-- форма без изменений -->
  </div>
</section>

<div id="qrModal" class="qr-modal">
  <div class="qr-sheet">
    <div class="qr-header">
      <div class="qr-title">Удостоверение личности</div>
      <button class="qr-close" id="closeQr">×</button>
    </div>
    <div class="qr-content">
      <div class="qr-text">Покажите QR-код сотруднику</div>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=yeahwww" class="qr-image">
      <div class="qr-subtext">или скажите код</div>
      <div class="qr-code">983517</div>
    </div>
  </div>
</div>

<!-- ================= ACCESS LOGIC ================= -->
<script>
function getDeviceId(){
  let id = localStorage.getItem('device_id_server');
  if(!id){
    id = crypto.randomUUID ? crypto.randomUUID() : 'dev-'+Date.now();
    localStorage.setItem('device_id_server', id);
  }
  return id;
}

const overlay = document.getElementById('gateOverlay');
const btn = document.getElementById('gateBtn');
const input = document.getElementById('gateCode');
const msg = document.getElementById('gateMsg');

if(localStorage.getItem('site_access_granted_server') === '1'){
  overlay.remove();
}

btn.onclick = async () => {
  const code = input.value.trim();
  if(!/^\d{6}$/.test(code)){
    msg.textContent = 'Код должен быть 6 цифр';
    return;
  }

  msg.textContent = 'Проверка...';

  const res = await fetch('/api/verify',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      code,
      deviceId:getDeviceId()
    })
  });

  const j = await res.json();

  if(res.ok && j.ok){
    localStorage.setItem('site_access_granted_server','1');
    overlay.remove();
  } else {
    msg.textContent = j.error || 'Неверный код';
  }
};
</script>

</body>
</html>
