<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>yeahwww</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">

  <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/icon-152.png">
  <link rel="apple-touch-icon" href="/icon-512.png">
</head>
<body>
  <div id="gateOverlay">
    <div class="gateCard">
      <div class="gateTitle">Получение доступа</div>
      <div class="gateSubtitle">Введите одноразовый код</div>
      <input id="gateCode" class="codeInput" maxlength="6" placeholder="XXXXXX" inputmode="numeric" />
      <button id="gateBtn" class="btnPrimary" type="button">Подтвердить код</button>
      <div id="gateMsg" class="gateMsg"></div>
      <a class="btnTelegram" href="https://t.me/yeahwww" target="_blank" rel="noopener noreferrer">Написать в Telegram</a>
    </div>
  </div>

  <div class="header">
    <button class="back-btn" onclick="history.back()">‹</button>
    <div class="header-title">Удостоверение личности</div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="doc" type="button">Документ</button>
    <button class="tab" data-tab="req" type="button">Реквизиты</button>
  </div>

  <section id="doc" class="screen active">
    <div class="photo-area">
      <button id="uploadBtn" class="upload-btn" type="button">Загрузить фото</button>
      <input type="file" id="photo" accept="image/*" hidden>
      <div id="preview"></div>
    </div>

    <div class="actions">
      <button class="primary" id="showQrBtn" type="button">
        <span class="btn-icon qr"></span>
        <span>Предъявить документ</span>
      </button>

      <button class="outline" type="button">
        <span class="btn-icon share"></span>
        <span>Отправить документ</span>
      </button>
    </div>
  </section>

  <section id="req" class="screen">
    <div class="form">
      <div class="field">
        <label>ФИО</label>
        <div class="copy-field">
          <input id="fio" type="text" class="field-text" placeholder="Официальный Telegram – @yeahwww">
          <button class="copy-btn" data-copy="fio" type="button" aria-label="Копировать ФИО"></button>
        </div>
      </div>

      <div class="field">
        <label>ИИН</label>
        <div class="copy-field">
          <input id="iin" type="text" class="field-text" placeholder="Официальный Telegram – @yeahwww">
          <button class="copy-btn" data-copy="iin" type="button" aria-label="Копировать ИИН"></button>
        </div>
      </div>

      <div class="field">
        <label>Дата рождения</label>
        <div class="copy-field">
          <input id="birth" type="text" class="field-text">
          <button class="copy-btn" data-copy="birth" type="button" aria-label="Копировать дату рождения"></button>
        </div>
      </div>

      <div class="field">
        <label>Номер документа</label>
        <div class="copy-field">
          <input id="docnum" type="text" class="field-text">
          <button class="copy-btn" data-copy="docnum" type="button" aria-label="Копировать номер документа"></button>
        </div>
      </div>

      <div class="field">
        <label>Дата выдачи</label>
        <div class="copy-field">
          <input id="issued" type="text" class="field-text">
          <button class="copy-btn" data-copy="issued" type="button" aria-label="Копировать дату выдачи"></button>
        </div>
      </div>

      <div class="field">
        <label>Срок действия</label>
        <div class="copy-field">
          <input id="expiry" type="text" class="field-text">
          <button class="copy-btn" data-copy="expiry" type="button" aria-label="Копировать срок действия"></button>
        </div>
      </div>

      <div class="actions">
        <button class="outline" type="button">
          <span class="btn-icon share"></span>
          <span>Отправить реквизиты</span>
        </button>
      </div>
    </div>
  </section>

  <div id="qrModal" class="qr-modal">
    <div class="qr-sheet">
      <div class="qr-header">
        <div class="qr-title">Удостоверение личности</div>
        <button class="qr-close" id="closeQr" type="button">×</button>
      </div>

      <div class="qr-content">
        <div class="qr-text">Покажите QR-код сотруднику</div>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=yeahwww" class="qr-image" alt="QR код">
        <div class="qr-subtext">или скажите код</div>
        <div class="qr-code">983517</div>
      </div>
    </div>
  </div>

  <script>
    function getDeviceId() {
      let id = localStorage.getItem('device_id_server');
      if (!id) {
        id = crypto.randomUUID ? crypto.randomUUID() : `dev-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
        localStorage.setItem('device_id_server', id);
      }
      return id;
    }

    function openApp() {
      const overlay = document.getElementById('gateOverlay');
      if (overlay) {
        overlay.remove();
      }
      document.body.classList.remove('app-locked');
    }

    document.addEventListener('DOMContentLoaded', () => {
      const overlay = document.getElementById('gateOverlay');
      const btn = document.getElementById('gateBtn');
      const input = document.getElementById('gateCode');
      const msg = document.getElementById('gateMsg');

      if (localStorage.getItem('site_access_granted_server') === '1') {
        openApp();
      }

      btn?.addEventListener('click', async () => {
        const code = input.value.trim();

        if (!/^\d{6}$/.test(code)) {
          msg.textContent = 'Введите 6 цифр';
          return;
        }

        btn.disabled = true;
        msg.textContent = 'Проверка...';

        try {
          const res = await fetch('/api/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code, deviceId: getDeviceId() })
          });

          const data = await res.json();

          if (res.ok && data.ok) {
            localStorage.setItem('site_access_granted_server', '1');
            openApp();
            return;
          }

          msg.textContent = data.error || 'Неверный код';
        } catch (error) {
          msg.textContent = 'Ошибка сети, попробуйте снова';
        } finally {
          btn.disabled = false;
        }
      });

      document.querySelectorAll('.tab').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById(btn.dataset.tab).classList.add('active');
        });
      });

      const fields = ['fio', 'iin', 'birth', 'docnum', 'issued', 'expiry'];
      fields.forEach(id => {
        const input = document.getElementById(id);
        if (!input) return;

        input.value = localStorage.getItem(id) || '';
        input.addEventListener('input', () => {
          localStorage.setItem(id, input.value);
        });
      });

      const uploadBtn = document.getElementById('uploadBtn');
      const photoInput = document.getElementById('photo');
      const preview = document.getElementById('preview');

      uploadBtn?.addEventListener('click', () => photoInput.click());

      photoInput?.addEventListener('change', () => {
        const file = photoInput.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = e => {
          preview.innerHTML = `<img src="${e.target.result}" alt="Загруженное фото">`;
          uploadBtn.style.display = 'none';
        };
        reader.readAsDataURL(file);
      });

      const showBtn = document.getElementById('showQrBtn');
      const modal = document.getElementById('qrModal');
      const closeBtn = document.getElementById('closeQr');

      showBtn?.addEventListener('click', () => modal.classList.add('show'));
      closeBtn?.addEventListener('click', () => modal.classList.remove('show'));
      modal?.addEventListener('click', e => {
        if (e.target === modal) modal.classList.remove('show');
      });

      document.addEventListener('click', async e => {
        const copyBtn = e.target.closest('.copy-btn');
        if (copyBtn) {
          const inputId = copyBtn.dataset.copy;
          const field = document.getElementById(inputId);
          if (!field) return;

          await navigator.clipboard.writeText(field.value || '');
          copyBtn.style.opacity = '0.5';
          setTimeout(() => {
            copyBtn.style.opacity = '1';
          }, 300);
          return;
        }

        const shareBtn = e.target.closest('.outline');
        if (!shareBtn || !shareBtn.textContent.includes('Отправить реквизиты')) return;

        const data = {
          fio: document.getElementById('fio')?.value || '',
          iin: document.getElementById('iin')?.value || '',
          birth: document.getElementById('birth')?.value || '',
          docnum: document.getElementById('docnum')?.value || '',
          issued: document.getElementById('issued')?.value || '',
          expiry: document.getElementById('expiry')?.value || ''
        };

        const text = `Удостоверение личности\n\nФИО: ${data.fio}\nИИН: ${data.iin}\nДата рождения: ${data.birth}\nНомер документа: ${data.docnum}\nДата выдачи: ${data.issued}\nСрок действия: ${data.expiry}`;

        if (navigator.share) {
          navigator.share({ title: 'Реквизиты документа', text });
        } else {
          await navigator.clipboard.writeText(text);
          alert('Реквизиты скопированы');
        }
      });
    });
  </script>
</body>
</html>
