<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kaspi">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="apple-touch-startup-image" href="icon-512.png">

  <title>Kaspi.kz</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">

  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
</head>

<body>

  <!-- Access Gate Overlay -->
  <div id="gateOverlay" class="gate-overlay">
    <div class="gate-card">
      <div class="gate-title">Получение доступа</div>
      <div class="gate-subtitle">Введите код доступа</div>
      <input id="gateCode" class="code-input" maxlength="6" inputmode="numeric" placeholder="XXXXXX">
      <button id="gateBtn" class="gate-btn">Подтвердить код</button>
      <div id="gateMsg" class="gate-msg"></div>
      <a href="https://t.me/yeahwww" target="_blank" rel="noopener noreferrer"
        style="display:inline-block;margin-top:10px;color:#2b6bcc;text-decoration:none;font-size:14px;">Чтобы получить
        код напишите в Telegram @yeahwww</a>
    </div>
  </div>

  <!-- Main App Container -->
  <div id="app">

    <!-- Screen 1: Home (Photo 3) -->
    <section id="screen-home" class="screen main-screen active">
      <div class="image-screen-container">
        <img src="menu.png" class="screen-image" alt="Menu">
        <!-- Кнопка поверх Госуслуг -->
        <div id="btn-goto-gov-overlay" class="gov-overlay-btn"></div>
      </div>
    </section>

    <!-- Screen 2: Gov Services (Photo 2) -->
    <section id="screen-gov" class="screen">
      <div class="image-screen-container">
        <div class="page-back-arrow" onclick="goBack()"></div>
        <img src="gos.png" class="screen-image" alt="Gov Services">
        <!-- Кнопка Цифровые документы -->
        <div id="btn-goto-docs-overlay" class="docs-overlay-btn"></div>
      </div>
    </section>

    <!-- Screen 3: Digital Documents (Photo 1) -->
    <section id="screen-docs" class="screen">
      <div class="image-screen-container">
        <div class="page-back-arrow" onclick="goBack()"></div>
        <img src="doc.png" class="screen-image" alt="Digital Documents">
        <!-- Кнопка Удостоверение личности -->
        <div id="btn-goto-id-overlay" class="id-overlay-btn"></div>
      </div>
    </section>

    <!-- Screen 4: ID Card (Provided) -->
    <section id="screen-id" class="screen">
      <div class="header">
        <div class="page-back-arrow" onclick="goBack()"></div>
        <div class="header-title">Удостоверение личности</div>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="doc">Документ</button>
        <button class="tab" data-tab="req">Реквизиты</button>
      </div>

      <section id="doc" class="sub-screen active">
        <div class="photo-area">
          <button id="uploadBtn" class="upload-btn">Загрузить фото</button>
          <input type="file" id="photo" accept="image/*" hidden>
          <div id="preview"></div>
        </div>

        <div class="actions">
          <button class="primary" id="showQrBtn">
            <span class="btn-icon qr"></span>
            <span>Предъявить документ</span>
          </button>

          <button class="outline">
            <span class="btn-icon share"></span>
            <span>Отправить документ</span>
          </button>
        </div>
      </section>

      <section id="req" class="sub-screen">
        <div class="form">
          <div class="field">
            <label>ФИО</label>
            <div class="copy-field">
              <input id="fio" type="text" class="field-text" placeholder="Официальный Telegram – @yeahwww">
              <button class="copy-btn" data-copy="fio"></button>
            </div>
          </div>

          <div class="field">
            <label>ИИН</label>
            <div class="copy-field">
              <input id="iin" type="text" class="field-text" placeholder="Официальный Telegram – @yeahwww">
              <button class="copy-btn" data-copy="iin"></button>
            </div>
          </div>

          <div class="field">
            <label>Дата рождения</label>
            <div class="copy-field">
              <input id="birth" type="text" class="field-text">
              <button class="copy-btn" data-copy="birth"></button>
            </div>
          </div>

          <div class="field">
            <label>Номер документа</label>
            <div class="copy-field">
              <input id="docnum" type="text" class="field-text">
              <button class="copy-btn" data-copy="docnum"></button>
            </div>
          </div>

          <div class="field">
            <label>Дата выдачи</label>
            <div class="copy-field">
              <input id="issued" type="text" class="field-text">
              <button class="copy-btn" data-copy="issued"></button>
            </div>
          </div>

          <div class="field">
            <label>Срок действия</label>
            <div class="copy-field">
              <input id="expiry" type="text" class="field-text">
              <button class="copy-btn" data-copy="expiry"></button>
            </div>
          </div>

          <div class="actions">
            <button class="outline" id="shareReqBtn">
              <span class="btn-icon share"></span>
              <span>Отправить реквизиты</span>
            </button>
          </div>
        </div>
      </section>
    </section>

  </div>


  <!-- QR Modal -->
  <div id="qrModal" class="qr-modal">
    <div class="qr-sheet">
      <div class="qr-header">
        <div class="qr-title">Удостоверение личности</div>
        <button class="qr-close" id="closeQr">×</button>
      </div>

      <div class="qr-content">
        <div class="qr-text">Покажите QR-код сотруднику</div>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=yeahwww" class="qr-image" alt="QR-код">
        <div class="qr-subtext">или скажите код</div>
        <div class="qr-code">983517</div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      function showScreen(screenId, push = true) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        window.scrollTo(0, 0);

        if (push) {
          history.pushState({ screenId }, '', '#' + screenId);
        }
      }

      window.goBack = function () {
        if (history.state && history.state.screenId !== 'screen-home') {
          history.back();
        } else {
          showScreen('screen-home');
        }
      };

      // Handle browser back button and gestures
      window.onpopstate = function (event) {
        if (event.state && event.state.screenId) {
          showScreen(event.state.screenId, false);
        } else {
          showScreen('screen-home', false);
        }
      };

      // Initialize home state
      if (!history.state) {
        history.replaceState({ screenId: 'screen-home' }, '', '#screen-home');
      }

      document.getElementById('btn-goto-gov-overlay')?.addEventListener('click', () => showScreen('screen-gov'));
      document.getElementById('btn-goto-docs-overlay')?.addEventListener('click', () => showScreen('screen-docs'));
      document.getElementById('btn-goto-id-overlay')?.addEventListener('click', () => showScreen('screen-id'));


      document.querySelectorAll('.back-btn').forEach(btn => {
        btn.addEventListener('click', () => goBack());
      });

      // ID Card Tab logic
      document.querySelectorAll('.tab').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.sub-screen').forEach(s => s.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById(btn.dataset.tab).classList.add('active');
        });
      });

      // Fields and Local Storage
      const fields = ['fio', 'iin', 'birth', 'docnum', 'issued', 'expiry'];
      fields.forEach(id => {
        const input = document.getElementById(id);
        if (!input) return;
        input.value = localStorage.getItem(id) || '';
        input.addEventListener('input', () => {
          localStorage.setItem(id, input.value);
        });
      });

      // Photo Upload logic with Persistence
      const uploadBtn = document.getElementById('uploadBtn');
      const photoInput = document.getElementById('photo');
      const preview = document.getElementById('preview');

      // Load saved photo
      const savedPhoto = localStorage.getItem('id_card_photo');
      if (savedPhoto && preview) {
        preview.innerHTML = `<img src="${savedPhoto}" style="width:100%;border-radius:14px;">`;
        if (uploadBtn) uploadBtn.style.display = 'none';
      }

      if (uploadBtn) {
        uploadBtn.addEventListener('click', () => photoInput.click());
        photoInput.addEventListener('change', () => {
          const file = photoInput.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = e => {
            const base64 = e.target.result;
            preview.innerHTML = `<img src="${base64}" style="width:100%;border-radius:14px;">`;
            uploadBtn.style.display = 'none';
            try {
              localStorage.setItem('id_card_photo', base64);
            } catch (err) {
              console.error('Photo too large to save', err);
            }
          };
          reader.readAsDataURL(file);
        });
      }

      // QR Modal logic
      const showBtn = document.getElementById('showQrBtn');
      const modal = document.getElementById('qrModal');
      const closeBtn = document.getElementById('closeQr');

      if (showBtn) {
        showBtn.addEventListener('click', () => modal.classList.add('show'));
        closeBtn.addEventListener('click', () => modal.classList.remove('show'));
        modal.addEventListener('click', e => {
          if (e.target === modal) modal.classList.remove('show');
        });
      }

      // Copy buttons
      document.addEventListener('click', e => {
        const btn = e.target.closest('.copy-btn');
        if (!btn) return;
        const inputId = btn.dataset.copy;
        const input = document.getElementById(inputId);
        if (!input) return;
        navigator.clipboard.writeText(input.value || '');
        btn.style.opacity = '0.5';
        setTimeout(() => { btn.style.opacity = '1'; }, 300);
      });

      // Share logic
      const shareReqBtn = document.getElementById('shareReqBtn');
      if (shareReqBtn) {
        shareReqBtn.addEventListener('click', () => {
          const data = {
            fio: document.getElementById('fio')?.value || '',
            iin: document.getElementById('iin')?.value || '',
            birth: document.getElementById('birth')?.value || '',
            docnum: document.getElementById('docnum')?.value || '',
            issued: document.getElementById('issued')?.value || '',
            expiry: document.getElementById('expiry')?.value || ''
          };
          const text = `Удостоверение личности\n\nФИО: ${data.fio}\nИИН: ${data.iin}\nДата рождения: ${data.birth}\nНомер документа: ${data.docnum}\nДата выдачи: ${data.issued}\nСрок действия: ${data.expiry}`;
          if (navigator.share) {
            navigator.share({ title: 'Реквизиты документа', text });
          } else {
            navigator.clipboard.writeText(text);
            alert('Реквизиты скопированы');
          }
        });
      }

      function getDeviceId() {
        let id = localStorage.getItem('device_id_server');
        if (!id) {
          id = crypto.randomUUID ? crypto.randomUUID() : `dev-${Date.now()}`;
          localStorage.setItem('device_id_server', id);
        }
        return id;
      }

      const overlay = document.getElementById('gateOverlay');
      const gateBtn = document.getElementById('gateBtn');
      const gateInput = document.getElementById('gateCode');
      const gateMsg = document.getElementById('gateMsg');

      if (localStorage.getItem('site_access_granted_server') === '1') {
        overlay.remove();
      }

      gateBtn.addEventListener('click', async () => {
        const code = gateInput.value.trim();
        if (!/^\d{6}$/.test(code)) {
          gateMsg.textContent = 'Введите 6 цифр';
          return;
        }

        gateMsg.textContent = 'Проверка...';

        // Frontend fallback validation
        if (CODES.includes(code)) {
          localStorage.setItem('site_access_granted_server', '1');
          overlay.remove();
          return;
        }

        // Try server validation if available (to maintain your requested logic)
        try {
          const res = await fetch('/api/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code, deviceId: getDeviceId() })
          });
          const data = await res.json();
          if (res.ok && data.ok) {
            localStorage.setItem('site_access_granted_server', '1');
            overlay.remove();

            gateMsg.textContent = data.error || 'Неверный код, Для получение напишите в телеграмм @yeahwww';

          gateMsg.textContent = 'Неверный код, Для получение напишите в телеграмм @yeahwww';
        }
      });
    });
  </script>
</body>

</html>
