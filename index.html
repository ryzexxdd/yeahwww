<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yeahwww</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">

  <style>
    /* ===== ACCESS GATE ===== */
    #gateOverlay{
      position:fixed;
      inset:0;
      background:#f6f6f7;
      z-index:99999;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding-top:36px;
    }
    .gateCard{
      width:94%;
      max-width:420px;
      background:#fff;
      border-radius:16px;
      padding:22px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
    }
    .gateTitle{font-size:22px;font-weight:700;margin:10px 0 6px;}
    .gateSubtitle{color:#6b6b6b;margin-bottom:14px;}
    .codeInput{
      width:80%;
      max-width:320px;
      margin:10px auto;
      font-size:22px;
      text-align:center;
      padding:12px;
      border-radius:12px;
      border:1px solid #eee;
      display:block;
    }
    .btnPrimary{
      background:#111;
      color:#fff;
      padding:12px 18px;
      border-radius:12px;
      border:none;
      font-weight:700;
      cursor:pointer;
    }
    .btnTelegram{
      display:block;
      margin:14px auto 0;
      background:#0a84ff;
      color:#fff;
      padding:12px;
      border-radius:12px;
      text-decoration:none;
      width:85%;
    }
    .gateMsg{margin-top:10px;color:#b00;}
  </style>
</head>

<body>

<!-- 🔒 OVERLAY -->
<div id="gateOverlay">
  <div class="gateCard">
    <div class="gateTitle">Получение доступа</div>
    <div class="gateSubtitle">Введите одноразовый код (6 цифр)</div>
    <input id="gateCode" class="codeInput" maxlength="6" placeholder="XXXXXX">
    <button id="gateBtn" class="btnPrimary">Подтвердить код</button>
    <div id="gateMsg" class="gateMsg"></div>
    <a class="btnTelegram" href="https://t.me/yeahwww" target="_blank">
      Написать в Telegram
    </a>
  </div>
</div>

<!-- ================== ТВОЙ САЙТ (ОРИГИНАЛ) ================== -->

<div class="header">
  <button class="back-btn" onclick="history.back()">‹</button>
  <div class="header-title">Удостоверение личности</div>
</div>

<div class="tabs">
  <button class="tab active" data-tab="doc">Документ</button>
  <button class="tab" data-tab="req">Реквизиты</button>
</div>

<section id="doc" class="screen active">
  <div class="photo-area">
    <button id="uploadBtn" class="upload-btn">Загрузить фото</button>
    <input type="file" id="photo" accept="image/*" hidden>
    <div id="preview"></div>
  </div>

  <div class="actions">
    <button class="primary" id="showQrBtn">Предъявить документ</button>
  </div>
</section>

<section id="req" class="screen">
  <div class="form">
    <div class="field"><label>ФИО</label><input id="fio"></div>
    <div class="field"><label>ИИН</label><input id="iin"></div>
  </div>
</section>

<!-- ================== LOGIC ================== -->

<script>
function getDeviceId(){
  let id = localStorage.getItem('device_id_server');
  if(!id){
    id = crypto.randomUUID ? crypto.randomUUID() : 'dev-'+Date.now();
    localStorage.setItem('device_id_server', id);
  }
  return id;
}

const overlay = document.getElementById('gateOverlay');
const btn = document.getElementById('gateBtn');
const input = document.getElementById('gateCode');
const msg = document.getElementById('gateMsg');

if(localStorage.getItem('site_access_granted_server') === '1'){
  overlay.remove();
}

btn.onclick = async () => {
  const code = input.value.trim();
  if(!/^\d{6}$/.test(code)){
    msg.textContent = 'Код должен быть 6 цифр';
    return;
  }

  msg.textContent = 'Проверка...';

  const res = await fetch('/api/verify',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ code, deviceId:getDeviceId() })
  });

  const j = await res.json();
  if(res.ok && j.ok){
    localStorage.setItem('site_access_granted_server','1');
    overlay.remove();
  } else {
    msg.textContent = j.error || 'Неверный код';
  }
};
</script>

</body>
</html>
