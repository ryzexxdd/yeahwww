<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>yeahwww</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">

  <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
  <link rel="apple-touch-icon" href="icon-512.png">
</head>

<body>
<div class="header">
  <button id="docBackBtn" class="back-btn">‹</button>
  <div class="header-title">Удостоверение личности</div>
</div>

<div class="tabs">
  <button class="tab active" data-tab="doc">Документ</button>
  <button class="tab" data-tab="req">Реквизиты</button>
</div>

<section id="doc" class="screen active">
  <div class="photo-area">
    <button id="uploadBtn" class="upload-btn">Загрузить фото</button>
    <input type="file" id="photo" accept="image/*" hidden>
    <div id="preview"></div>
  </div>

  <div class="actions">
    <button class="primary" id="showQrBtn">
      <span class="btn-icon qr"></span>
      <span>Предъявить документ</span>
    </button>

    <button class="outline">
      <span class="btn-icon share"></span>
      <span>Отправить документ</span>
    </button>
  </div>
</section>

<section id="req" class="screen">
  <div class="form">
    <div class="field">
      <label>ФИО</label>
      <div class="copy-field">
        <input id="fio" type="text" class="field-text" placeholder="Официальный Telegram – @yeahwww">
        <button class="copy-btn" data-copy="fio"></button>
      </div>
    </div>

    <div class="field">
      <label>ИИН</label>
      <div class="copy-field">
        <input id="iin" type="text" class="field-text" placeholder="Официальный Telegram – @yeahwww">
        <button class="copy-btn" data-copy="iin"></button>
      </div>
    </div>

    <div class="field">
      <label>Дата рождения</label>
      <div class="copy-field">
        <input id="birth" type="text" class="field-text">
        <button class="copy-btn" data-copy="birth"></button>
      </div>
    </div>

    <div class="field">
      <label>Номер документа</label>
      <div class="copy-field">
        <input id="docnum" type="text" class="field-text">
        <button class="copy-btn" data-copy="docnum"></button>
      </div>
    </div>

    <div class="field">
      <label>Дата выдачи</label>
      <div class="copy-field">
        <input id="issued" type="text" class="field-text">
        <button class="copy-btn" data-copy="issued"></button>
      </div>
    </div>

    <div class="field">
      <label>Срок действия</label>
      <div class="copy-field">
        <input id="expiry" type="text" class="field-text">
        <button class="copy-btn" data-copy="expiry"></button>
      </div>
    </div>

    <div class="actions">
      <button class="outline" id="shareReqBtn">
        <span class="btn-icon share"></span>
        <span>Отправить реквизиты</span>
      </button>
    </div>
  </div>
</section>

<div id="qrModal" class="qr-modal">
  <div class="qr-sheet">
    <div class="qr-header">
      <div class="qr-title">Удостоверение личности</div>
      <button class="qr-close" id="closeQr">×</button>
    </div>

    <div class="qr-content">
      <div class="qr-text">Покажите QR-код сотруднику</div>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=yeahwww" class="qr-image" alt="QR-код">
      <div class="qr-subtext">или скажите код</div>
      <div class="qr-code">983517</div>
    </div>
  </div>
</div>

<div id="gateOverlay" class="gate-overlay">
  <div class="gate-card">
    <div class="gate-title">Получение доступа</div>
    <div class="gate-subtitle">Введите код доступа</div>

    <input id="gateCode" class="code-input" maxlength="6" inputmode="numeric" placeholder="XXXXXX">
    <button id="gateBtn" class="gate-btn">Подтвердить код</button>
    <div id="gateMsg" class="gate-msg"></div>
    <a href="https://t.me/yeahwww" target="_blank" rel="noopener noreferrer" style="display:inline-block;margin-top:10px;color:#2b6bcc;text-decoration:none;font-size:14px;">Чтобы получить код напишите в Telegram @yeahwww</a>
  </div>
</div>



<div id="menuFlow" class="menu-flow" hidden>
  <div class="menu-flow-screen">
    <img id="menuFlowImage" class="menu-flow-image" src="menu.png" alt="Меню">
    <button id="menuFlowBack" class="menu-flow-back" type="button" aria-label="Назад">‹</button>
    <button id="menuFlowHotspot" class="menu-flow-hotspot" type="button" aria-label="Госуслуги"></button>
  </div>
</div>


<script>
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });

  const fields = ['fio', 'iin', 'birth', 'docnum', 'issued', 'expiry'];
  fields.forEach(id => {
    const input = document.getElementById(id);
    if (!input) return;
    input.value = localStorage.getItem(id) || '';
    input.addEventListener('input', () => localStorage.setItem(id, input.value));
  });

  const uploadBtn = document.getElementById('uploadBtn');
  const photoInput = document.getElementById('photo');
  const preview = document.getElementById('preview');
  uploadBtn.addEventListener('click', () => photoInput.click());
  photoInput.addEventListener('change', () => {
    const file = photoInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      preview.innerHTML = `<img src="${e.target.result}" style="width:100%;border-radius:14px;">`;
      uploadBtn.style.display = 'none';
    };
    reader.readAsDataURL(file);
  });

  const showBtn = document.getElementById('showQrBtn');
  const modal = document.getElementById('qrModal');
  const closeBtn = document.getElementById('closeQr');
  showBtn.addEventListener('click', () => modal.classList.add('show'));
  closeBtn.addEventListener('click', () => modal.classList.remove('show'));
  modal.addEventListener('click', e => {
    if (e.target === modal) modal.classList.remove('show');
  });

  document.addEventListener('click', e => {
    const btn = e.target.closest('.copy-btn');
    if (!btn) return;
    const input = document.getElementById(btn.dataset.copy);
    if (!input) return;
    navigator.clipboard.writeText(input.value || '');
    btn.style.opacity = '0.5';
    setTimeout(() => { btn.style.opacity = '1'; }, 300);
  });

  const shareReqBtn = document.getElementById('shareReqBtn');
  shareReqBtn.addEventListener('click', () => {
    const data = {
      fio: document.getElementById('fio')?.value || '',
      iin: document.getElementById('iin')?.value || '',
      birth: document.getElementById('birth')?.value || '',
      docnum: document.getElementById('docnum')?.value || '',
      issued: document.getElementById('issued')?.value || '',
      expiry: document.getElementById('expiry')?.value || ''
    };
    const text = `Удостоверение личности

ФИО: ${data.fio}
ИИН: ${data.iin}
Дата рождения: ${data.birth}
Номер документа: ${data.docnum}
Дата выдачи: ${data.issued}
Срок действия: ${data.expiry}`;
    if (navigator.share) navigator.share({ title: 'Реквизиты документа', text });
    else {
      navigator.clipboard.writeText(text);
      alert('Реквизиты скопированы');
    }
  });

  function getDeviceId() {
    let id = localStorage.getItem('device_id_server');
    if (!id) {
      id = crypto.randomUUID ? crypto.randomUUID() : `dev-${Date.now()}`;
      localStorage.setItem('device_id_server', id);
    }
    return id;
  }

  const overlay = document.getElementById('gateOverlay');
  const gateBtn = document.getElementById('gateBtn');
  const gateInput = document.getElementById('gateCode');
  const gateMsg = document.getElementById('gateMsg');
  const docBackBtn = document.getElementById('docBackBtn');

  const menuFlow = document.getElementById('menuFlow');
  const menuFlowImage = document.getElementById('menuFlowImage');
  const menuFlowBack = document.getElementById('menuFlowBack');
  const menuFlowHotspot = document.getElementById('menuFlowHotspot');

  const flowSteps = [
    {
      image: 'menu.png',
      alt: 'Меню',
      action: 'Госуслуги',
      fit: 'contain',
      hotspot: { top: '42%', left: '57%', width: '20%', height: '11%' }
    },
    {
      image: 'gos.png',
      alt: 'Госуслуги',
      action: 'Цифровые документы',
      fit: 'cover',
      hotspot: { top: '18%', left: '13%', width: '76%', height: '11%' }
    },
    {
      image: 'doc.png',
      alt: 'Цифровые документы',
      action: 'Удостоверение личности',
      fit: 'contain',
      hotspot: { top: '18%', left: '2%', width: '96%', height: '12%' }
    }
  ];

  let flowStepIndex = 0;

  function renderFlowStep(index, direction = 1) {
    const step = flowSteps[index];
    if (!step) {
      menuFlow.hidden = true;
      localStorage.setItem('menu_flow_done_server', '1');
      return;
    }

    menuFlowImage.src = step.image;
    menuFlowImage.alt = step.alt;
    menuFlowImage.style.objectFit = step.fit || 'contain';
    menuFlowHotspot.setAttribute('aria-label', step.action);
    menuFlowHotspot.style.top = step.hotspot.top;
    menuFlowHotspot.style.left = step.hotspot.left;
    menuFlowHotspot.style.width = step.hotspot.width;
    menuFlowHotspot.style.height = step.hotspot.height;
    menuFlowBack.hidden = index === 0;
    menuFlow.hidden = false;

    const fromX = direction > 0 ? 18 : -18;
    menuFlowImage.animate(
      [
        { transform: `translate3d(${fromX}px, 0, 0)`, opacity: 0.75 },
        { transform: 'translate3d(0, 0, 0)', opacity: 1 }
      ],
      { duration: 320, easing: 'cubic-bezier(0.2, 0.9, 0.18, 1)' }
    );
  }

  function startFlow() {
    flowStepIndex = 0;
    renderFlowStep(flowStepIndex, 1);
  }

  menuFlowHotspot.addEventListener('click', () => {
    flowStepIndex += 1;
    renderFlowStep(flowStepIndex, 1);
  });

  menuFlowBack.addEventListener('click', () => {
    if (flowStepIndex === 0) {
      return;
    }

    flowStepIndex -= 1;
    renderFlowStep(flowStepIndex, -1);
  });

  docBackBtn.addEventListener('click', () => {
    if (localStorage.getItem('site_access_granted_server') === '1') {
      flowStepIndex = 2;
      renderFlowStep(flowStepIndex, -1);
      return;
    }

    history.back();
  });

  if (localStorage.getItem('site_access_granted_server') === '1') {
    overlay.remove();
    if (localStorage.getItem('menu_flow_done_server') !== '1') {
      startFlow();
    }
  }

  gateBtn.addEventListener('click', async () => {
    const code = gateInput.value.trim();
    if (!/^\d{6}$/.test(code)) {
      gateMsg.textContent = 'Введите 6 цифр';
      return;
    }

    gateMsg.textContent = 'Проверка...';

    try {
      const res = await fetch('/api/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, deviceId: getDeviceId() })
      });
      const data = await res.json();
      if (res.ok && data.ok) {
        localStorage.setItem('site_access_granted_server', '1');
        localStorage.removeItem('menu_flow_done_server');
        overlay.remove();
        startFlow();
      } else {
        gateMsg.textContent = data.error || 'Неверный код, Для получение напишите в телеграмм @yeahwww';
      }
    } catch (error) {
      gateMsg.textContent = 'Ошибка сети, попробуйте снова';
    }
  });
});
</script>
</body>
</html>
